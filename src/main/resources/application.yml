server:
  port: 8093
  servlet:
    context-path: /hx_replay

spring:
  application:
    name: hx_replay
  profiles:
    active: prod
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
